# Weekly update PRs for the app's Gradle dependencies and for the actions the
# workflows use (which are pinned to commit SHAs; Dependabot bumps the SHA and
# the version comment together).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
