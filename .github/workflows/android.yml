name: 🫣 Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure variant
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
            echo "VARIANT=assembleWebsiteFullDebug" >> $GITHUB_ENV
          else
            echo "VARIANT=assembleFdroidFullDebug" >> $GITHUB_ENV
          fi
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 1
          command: ./gradlew ${{ env.VARIANT }} --info --warning-mode all --no-configuration-cache
      - run: ./gradlew testFdroidFullDebugUnitTest --no-configuration-cache --continue
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 30
          if-no-files-found: warn
      - run: ./gradlew lintFdroidFullDebug --no-configuration-cache
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 30
          if-no-files-found: warn
      - run: |
          UNIVERSAL_APK=$(find app/build/outputs/apk/ -name "*universal*.apk" | head -1)
          echo "UNIVERSAL_APK=$UNIVERSAL_APK" >> $GITHUB_ENV
      - if: success() && env.UNIVERSAL_APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: rethink-dns-apk
          path: ${{ env.UNIVERSAL_APK }}
