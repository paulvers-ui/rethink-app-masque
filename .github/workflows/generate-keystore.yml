# Generates the release signing keystore ONCE. Run this by hand
# (Actions → 🔑 Generate release keystore → Run workflow), save the four
# secrets it gives you, and then delete this run from the Actions history
# (the logs are visible to anyone with read access to the repo, and the
# artifact contains the key in base64).
#
# Once the secrets are saved, this key signs ALL future releases. If you
# lose it, any update you publish afterward won't be installable over what
# people already have -- Android requires the signer to match to update
# without uninstalling first.
name: 🔑 Generate release keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to confirm (this creates a new key; do not run this again if you already have one in use)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "GENERATE" ]; then
            echo "::error::Type exactly GENERATE in the confirmation field to continue."
            exit 1
          fi

      - name: 🔑 Create the keystore
        id: gen
        run: |
          set -eu
          # keytool defaults to PKCS12 (has since JDK 9+), and PKCS12
          # keystores do not support a key password that differs from the
          # store password -- keytool silently IGNORES -keypass and forces
          # the key password to equal the store password, printing only a
          # warning:
          #   "Different store and key passwords not supported for PKCS12
          #    KeyStores. Ignoring user-specified -keypass value."
          # This workflow used to generate two independent random passwords
          # and report both as if they were both honored. They weren't --
          # every keystore this workflow ever produced actually had
          # key password == store password, but RELEASE_KEY_PASSWORD was
          # reported as a different, unused value. The release build then
          # tried to unlock the private key with that wrong password and
          # failed every time with "Get Key failed: Given final block not
          # properly padded" -- confirmed by reproducing it locally:
          # exporting the cert with storepass+the reported keypass fails
          # with the same keytool warning and error; exporting with
          # storepass alone (i.e. storepass used as the key password too)
          # succeeds.
          #
          # Fix: one password, used for both. Matches what keytool actually
          # does instead of pretending otherwise.
          STORE_PASS=$(openssl rand -base64 24)
          ALIAS="rethinkforkrelease"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=Rethink Dns Fork, OU=paulvers-ui, O=paulvers-ui, L=Unknown, S=Unknown, C=US"

          base64 -w0 release.keystore > release.keystore.b64

          {
            echo "## Save these four values as Repository Secrets"
            echo "## (Settings → Secrets and variables → Actions → New repository secret)"
            echo ""
            echo "RELEASE_KEYSTORE_BASE64:"
            echo "  (contents of the attached release.keystore.b64 file -- too long to paste here)"
            echo ""
            echo "RELEASE_KEYSTORE_PASSWORD:"
            echo "  $STORE_PASS"
            echo ""
            echo "RELEASE_KEY_ALIAS:"
            echo "  $ALIAS"
            echo ""
            echo "RELEASE_KEY_PASSWORD:"
            echo "  $STORE_PASS"
            echo "  (same value as RELEASE_KEYSTORE_PASSWORD -- PKCS12 keystores"
            echo "  don't support a separate key password; see the comment in"
            echo "  this workflow's 'Create the keystore' step for why)"
          } > secrets-to-save.txt

          sha256sum release.keystore | tee release.keystore.sha256
        shell: bash

      - name: 📦 Upload as artifact (short retention on purpose)
        uses: actions/upload-artifact@v6
        with:
          name: keystore-NEW-save-it-and-delete-this-artifact
          path: |
            release.keystore.b64
            secrets-to-save.txt
            release.keystore.sha256
          retention-days: 1

      - name: 📋 Instructions
        run: |
          echo "::notice::Download this run's artifact (above, on the workflow page). It contains:"
          echo "::notice::  1) release.keystore.b64 -> paste the whole thing as the RELEASE_KEYSTORE_BASE64 secret"
          echo "::notice::  2) secrets-to-save.txt -> the other three secrets (password, alias, key password)"
          echo "::notice::"
          echo "::notice::After saving all 4 secrets in Settings > Secrets and variables > Actions:"
          echo "::notice::  - Delete this artifact (Actions > this run > Delete artifact)"
          echo "::notice::  - Do not run this workflow again unless you want a NEW key (breaks updates)"
