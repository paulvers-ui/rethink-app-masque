# Genera el keystore de firma de release UNA SOLA VEZ. Corre esto a mano
# (Actions → 🔑 Generar keystore de release → Run workflow), guarda los
# cuatro secrets que te da, y luego borra este run del historial de Actions
# (los logs quedan visibles para cualquiera con acceso de lectura al repo,
# y el artefacto contiene la clave en base64).
#
# Después de guardar los secrets, esta clave firma TODOS los releases futuros.
# Si la pierdes, cualquier actualización que publiques después no podrá
# instalarse encima de lo que la gente ya tiene instalado -- Android exige
# que el firmante coincida para actualizar sin desinstalar primero.
name: 🔑 Generar keystore de release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe GENERAR para confirmar (esto crea una clave nueva; no la vuelvas a correr si ya tienes una en uso)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Verificar confirmación
        run: |
          if [ "${{ inputs.confirm }}" != "GENERAR" ]; then
            echo "::error::Escribe exactamente GENERAR en el campo de confirmación para continuar."
            exit 1
          fi

      - name: 🔑 Crear el keystore
        id: gen
        run: |
          set -eu
          STORE_PASS=$(openssl rand -base64 24)
          KEY_PASS=$(openssl rand -base64 24)
          ALIAS="rethinkforkrelease"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Rethink Dns Fork, OU=paulvers-ui, O=paulvers-ui, L=Unknown, S=Unknown, C=US"

          base64 -w0 release.keystore > release.keystore.b64

          {
            echo "## Guarda estos cuatro valores como Repository Secrets"
            echo "## (Settings → Secrets and variables → Actions → New repository secret)"
            echo ""
            echo "RELEASE_KEYSTORE_BASE64:"
            echo "  (contenido del archivo release.keystore.b64 adjunto -- es muy largo para pegar aquí)"
            echo ""
            echo "RELEASE_KEYSTORE_PASSWORD:"
            echo "  $STORE_PASS"
            echo ""
            echo "RELEASE_KEY_ALIAS:"
            echo "  $ALIAS"
            echo ""
            echo "RELEASE_KEY_PASSWORD:"
            echo "  $KEY_PASS"
          } > secrets-para-guardar.txt

          sha256sum release.keystore | tee release.keystore.sha256
        shell: bash

      - name: 📦 Subir como artefacto (retención corta a propósito)
        uses: actions/upload-artifact@v6
        with:
          name: keystore-NUEVO-guardalo-y-borra-este-artefacto
          path: |
            release.keystore.b64
            secrets-para-guardar.txt
            release.keystore.sha256
          retention-days: 1

      - name: 📋 Instrucciones
        run: |
          echo "::notice::Descarga el artefacto de este run (arriba, en la página del workflow). Contiene:"
          echo "::notice::  1) release.keystore.b64 -> pégalo entero como el secret RELEASE_KEYSTORE_BASE64"
          echo "::notice::  2) secrets-para-guardar.txt -> los otros tres secrets (password, alias, key password)"
          echo "::notice::"
          echo "::notice::Después de guardar los 4 secrets en Settings > Secrets and variables > Actions:"
          echo "::notice::  - Borra este artefacto (Actions > este run > Delete artifact)"
          echo "::notice::  - No corras este workflow otra vez salvo que quieras una clave NUEVA (rompe actualizaciones)"
