# The one release pipeline. Every push to main (and every new libusque.so the
# usque "Final workflow" commits here) becomes a new version:
#
#   1. auto-tag     bumps the version from the commits (fix: -> patch,
#                   feat: -> minor, BREAKING CHANGE -> major; default patch)
#   2. build        builds the fdroidFull DEBUG APK only (debug-keystore-signed).
#                   No release build, no signing secrets are read here.
#   3. publish      one GitHub Release for the tag with the debug APK and its
#                   SHA-256 file; Obtainium picks it up
#
# A signed release APK is no longer attached here. If one is ever needed,
# run the manual "Signed release APK" workflow (release-signed.yml).
#
# Pull requests do not come here (fork PRs get no secrets): android.yml builds
# and tests them, and auto-build.yml attaches a debug APK.
name: Final release ultimate

on:
  push:
    branches: [main]
    # Doc/CI-only changes do not need a new release (and an Obtainium
    # notification); libusque.so and every app change do.
    paths-ignore:
      - '**.md'
      - 'fdroid/**'
      - '.github/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.11.1. Leave empty to release a new version from main.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Releases queue up in order; cancelling one halfway could leave a tag
  # without its release.
  group: final-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-tag:
    name: 🏷️ New version
    runs-on: ubuntu-latest
    # A push to main, or a manual run without a tag: a new version. (A manual
    # run without one used to release under the branch name, which is how this
    # repo got a tag called "main".)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Parses commits since the last tag using Angular commit-message
      # conventions (feat:/fix:/BREAKING CHANGE:) to pick patch/minor/major,
      # falling back to default_bump (patch).
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  build-and-release:
    name: 📦 Build debug APK and release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [auto-tag]
    # Runs for a new tag, a published release, or a manual run of an existing
    # tag. Not `always()` alone: if auto-tag genuinely failed, nothing ships.
    if: |
      always() &&
      (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped') &&
      (needs.auto-tag.outputs.new_tag != '' || github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))

    env:
      NDKVER: "28.2.13676358"
      SDKVER: "36"
      # Same firestack commit android.yml and auto-build.yml pin (branch n2,
      # the API this Kotlin expects: 3-arg OnQuery, Gostr/Gobyte).
      FIRESTACK_COMMIT: "eb6d2aa43ee35eb4ce9bbca43289648334ee680c"
      VER: ${{ needs.auto-tag.outputs.new_tag || inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VER }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.26'
          cache: false

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: 🤖 Install SDK ${{ env.SDKVER }} + NDK ${{ env.NDKVER }}
        # max_attempts: 1 -- every failure so far was deterministic (a missing
        # chmod, a wrong dependency name, a Kotlin compile error); retrying
        # only burns minutes failing the same way.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 1
          command: |
            sdkmanager --install "platforms;android-${SDKVER}" "build-tools;${SDKVER}.0.0"
            sdkmanager --install "ndk;${NDKVER}" || echo "NDKVER=0" >> "$GITHUB_ENV"

      - id: firestack-cache
        uses: actions/cache@v4
        with:
          path: /tmp/firestack-aar-cache/firestack.aar
          key: firestack-aar-${{ env.FIRESTACK_COMMIT }}-ndk${{ env.NDKVER }}

      - name: 🏗️ Build firestack.aar (${{ github.repository_owner }}/firestack@${{ env.FIRESTACK_COMMIT }})
        if: steps.firestack-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 1
          command: |
            set -eu
            git clone -q "https://github.com/${{ github.repository_owner }}/firestack.git" /tmp/firestack
            cd /tmp/firestack
            git checkout -q "${FIRESTACK_COMMIT}"
            chmod +x make-aar
            ./make-aar nogo nodebug
            mkdir -p /tmp/firestack-aar-cache
            cp firestack.aar /tmp/firestack-aar-cache/firestack.aar

      - name: 📋 Place firestack-local.aar
        run: |
          set -eu
          test -s /tmp/firestack-aar-cache/firestack.aar || {
            echo "::error::firestack.aar missing after build/cache-restore step"
            exit 1
          }
          mkdir -p app/libs
          # app/build.gradle's "local" case resolves com.celzero:firestack:local@aar
          # through the root build.gradle's flatDir repo, by this exact file name.
          cp /tmp/firestack-aar-cache/firestack.aar app/libs/firestack-local.aar
        shell: bash

      - name: ⚙️ gradlew permissions
        run: chmod +x gradlew

      - name: 🚂 Build debug APK (fdroidFull)
        run: |
          set -u
          log="$RUNNER_TEMP/gradle.log"
          : > "$log"
          # gradle.properties caps the Gradle/Kotlin heap at 2 GB, which has run
          # out of memory in compileFdroidFullDebugKotlin; give it a bigger heap.
          run_gradle() {
            ./gradlew "$@" -PfirestackRepo=local --no-configuration-cache --warning-mode all \
              "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
              "-Pkotlin.daemon.jvmargs=-Xmx3g" 2>&1 | tee -a "$log"
            return "${PIPESTATUS[0]}"
          }
          rc=0
          run_gradle assembleFdroidFullDebug || rc=$?
          if [ "$rc" -ne 0 ]; then
            # Surface the real reason as an annotation and in the job summary.
            why=$({ grep -A12 -m1 'What went wrong' "$log"; grep -m8 -E '^e: |error: |FAILED' "$log"; } | cut -c1-300 | head -20)
            echo "::error title=Gradle build failed::$(echo "$why" | tr '\n' '|' | cut -c1-1500)"
            { echo '### Gradle failure'; echo '```'; echo "$why"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
        shell: bash

      # app/build.gradle disables splits.abi and pins abiFilters to 'arm64-v8a',
      # so the debug build gives exactly ONE apk. It is inspected with aapt
      # rather than trusted by file name: applicationId must be right and the
      # native code arm64-only (libusque.so has no 32-bit build), so an abi
      # regression fails the release instead of shipping an APK without WARP.
      - name: 🔎 Verify and name the debug APK
        id: apks
        run: |
          set -eu
          AAPT="$ANDROID_HOME/build-tools/${SDKVER}.0.0/aapt"

          check() { # check <apk>: applicationId and arm64-only native code
            local f="$1" appid natives
            appid=$("$AAPT" dump badging "$f" | grep -oP "package: name='\K[^']+")
            if [ "$appid" != "com.paulvers.auroravpn" ]; then
              echo "::error::$f has applicationId '$appid', expected com.paulvers.auroravpn"
              exit 1
            fi
            natives=$("$AAPT" dump badging "$f" | grep "native-code" || echo "native-code: (none)")
            case "$natives" in
              *armeabi-v7a*|*x86*) echo "::error::$f contains 32-bit/x86 native code ($natives); this project is arm64-only"; exit 1 ;;
              *arm64-v8a*) ;;
              *) echo "::error::$f has no arm64-v8a native code ($natives)"; exit 1 ;;
            esac
          }
          one() { # one <dir>: the single APK a build type produced
            local found
            mapfile -t found < <(find "$1" -name "*.apk" 2>/dev/null)
            test "${#found[@]}" -eq 1 || { echo "::error::expected one APK in $1, found ${#found[@]}" >&2; exit 1; }
            echo "${found[0]}"
          }

          files=()
          src=$(one app/build/outputs/apk/fdroidFull/debug)
          check "$src"
          debug_apk="AuroraVPN-${VER}-debug.apk"
          cp "$src" "$debug_apk"
          sha256sum "$debug_apk" > "$debug_apk.sha256"
          files+=("$debug_apk" "$debug_apk.sha256")

          versionName=$("$AAPT" dump badging "$debug_apk" | grep -oP "versionName='\K[^']+")
          versionCode=$("$AAPT" dump badging "$debug_apk" | grep -oP "versionCode='\K[^']+")
          echo "$VER: debug only, versionName=$versionName versionCode=$versionCode"
          {
            echo "files<<APKEOF"
            printf '%s\n' "${files[@]}"
            echo "APKEOF"
            echo "version_name=${versionName}"
            echo "version_code=${versionCode}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: 📝 Changelog since the previous tag
        id: changelog
        run: |
          set -eu
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${VER}^" 2>/dev/null || echo "")
          {
            echo "changelog<<CHANGELOGEOF"
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo ""
              git log --oneline "${prev}..${VER}" -- ':!fdroid' ':!.github' | sed 's/^/- /'
            else
              echo "First tagged release."
            fi
            echo "CHANGELOGEOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: apk-${{ env.VER }}
          path: ${{ steps.apks.outputs.files }}
          if-no-files-found: error

      - name: 📦 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          name: AuroraVPN ${{ env.VER }}
          prerelease: ${{ contains(env.VER, '-alpha') || contains(env.VER, '-beta') || contains(env.VER, '-rc') }}
          generate_release_notes: true
          body: |
            Built and released automatically from this commit.
            versionName `${{ steps.apks.outputs.version_name }}`, versionCode `${{ steps.apks.outputs.version_code }}`.

            - `AuroraVPN-<version>-debug.apk`: debug build (debug-keystore-signed). This is the only APK in this release. Android will not install it over a previously installed signed build, or the other way round.

            **Requires a 64-bit ARM (arm64-v8a) device.** `libusque.so` (WARP) has no 32-bit build.

            **Install with [Obtainium](https://github.com/ImranR98/Obtainium):** add this repository
            (`${{ github.repository }}`) as a "GitHub" source.

            firestack built from `${{ github.repository_owner }}/firestack@${{ env.FIRESTACK_COMMIT }}`
            (branch `n2`). `fdroidFull` variant: no Firebase, no Google Play Services.
            SHA-256 of each APK is in its `.sha256` file.

            ---

            ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.apks.outputs.files }}
