name: 📦 Release APK

on:
  push:
    branches: [main, tests, tests-lightver]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  auto-tag:
    name: Auto tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [auto-tag]
    if: always()
    env:
      NDKVER: "28.2.13676358"
      SDKVER: "36"
      FIRESTACK_COMMIT: "05a664580caca8e30a912b75f2ffe480560e70ae"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.auto-tag.outputs.new_tag || github.ref }}
          fetch-depth: 0
      - name: Check secrets
        run: |
          missing=""
          [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ] && missing="$missing RELEASE_KEY_PASSWORD"
          [ -n "$missing" ] && echo "::error::Missing:$missing" && exit 1 || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            sdkmanager --install "platforms;android-${SDKVER}" "build-tools;${SDKVER}.0.0"
            sdkmanager --install "ndk;${NDKVER}" || echo "NDKVER=0" >> "$GITHUB_ENV"
      - id: firestack-cache
        uses: actions/cache@v4
        with:
          path: /tmp/firestack-aar-cache/firestack.aar
          key: firestack-aar-${{ env.FIRESTACK_COMMIT }}-ndk${{ env.NDKVER }}
      - if: steps.firestack-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: |
            git clone -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/paulvers-ui/firestack.git /tmp/firestack
            cd /tmp/firestack && git checkout -q "${FIRESTACK_COMMIT}"
            chmod +x make-aar && ./make-aar nogo nodebug
            mkdir -p /tmp/firestack-aar-cache && cp firestack.aar /tmp/firestack-aar-cache/
      - run: mkdir -p app/libs && cp /tmp/firestack-aar-cache/firestack.aar app/libs/firestack-local.aar
      - run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - name: Build release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleFdroidFullRelease -PfirestackRepo=local --no-configuration-cache --info --warning-mode all
      - id: apks
        run: |
          set -eu
          AAPT="$ANDROID_HOME/build-tools/${SDKVER}.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/${SDKVER}.0.0/apksigner"
          mapfile -t found < <(find app/build/outputs/apk/fdroidFull/release -name "*.apk")
          declare universal="" arm64="" armv7=""
          ver="${{ inputs.tag || needs.auto-tag.outputs.new_tag || github.ref_name }}"
          for f in "${found[@]}"; do
            "$APKSIGNER" verify "$f" >/dev/null 2>&1 || { echo "::error::$f failed verification"; exit 1; }
            natives=$("$AAPT" dump badging "$f" | grep "native-code" || echo "none")
            case "$natives" in
              *arm64*armeabi*|*armeabi*arm64*) universal="$f" ;;
              *arm64*) arm64="$f" ;;
              *armeabi*) armv7="$f" ;;
            esac
          done
          test -n "$universal" || { echo "::error::No universal APK"; exit 1; }
          cp "$universal" "RethinkDnsFork-${ver}.apk"
          sha256sum "RethinkDnsFork-${ver}.apk" > "RethinkDnsFork-${ver}.apk.sha256"
          files="RethinkDnsFork-${ver}.apk"$'\n'"RethinkDnsFork-${ver}.apk.sha256"
          [ -n "$arm64" ] && cp "$arm64" "RethinkDnsFork-${ver}-arm64.apk" && files+=$'\n'"RethinkDnsFork-${ver}-arm64.apk"
          [ -n "$armv7" ] && cp "$armv7" "RethinkDnsFork-${ver}-armv7.apk" && files+=$'\n'"RethinkDnsFork-${ver}-armv7.apk"
          vN=$("$AAPT" dump badging "RethinkDnsFork-${ver}.apk" | grep -oP "versionName='\K[^']+"  )
          vC=$("$AAPT" dump badging "RethinkDnsFork-${ver}.apk" | grep -oP "versionCode='\K[^']+")
          { echo "files<<EOF"; echo "$files"; echo "EOF"
            echo "version=${ver}"; echo "version_name=${vN}"; echo "version_code=${vC}"
          } >> "$GITHUB_OUTPUT"
        shell: bash
      - id: changelog
        run: |
          ver="${{ inputs.tag || needs.auto-tag.outputs.new_tag || github.ref_name }}"
          prev=$(git describe --tags --abbrev=0 "${ver}^" 2>/dev/null || echo "")
          { echo "changelog<<EOF"
            [ -n "$prev" ] && git log --oneline "${prev}..${ver}" | sed 's/^/- /' || echo "First release."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.apks.outputs.version }}
          path: ${{ steps.apks.outputs.files }}
          if-no-files-found: error
      - if: needs.auto-tag.outputs.new_tag != '' || github.ref_type == 'tag' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apks.outputs.version }}
          name: Rethink Dns Fork ${{ steps.apks.outputs.version }}
          prerelease: ${{ contains(steps.apks.outputs.version, '-alpha') || contains(steps.apks.outputs.version, '-beta') || contains(steps.apks.outputs.version, '-rc') }}
          generate_release_notes: true
          body: |
            versionName `${{ steps.apks.outputs.version_name }}`, versionCode `${{ steps.apks.outputs.version_code }}`.
            firestack @ `${{ env.FIRESTACK_COMMIT }}` · fdroidFull (no Firebase).
            SHA256 in the `.sha256` file.
            ---
            ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.apks.outputs.files }}
