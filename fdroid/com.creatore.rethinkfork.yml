# Placeholders rellenados con valores reales y verificados (commit v1.0.0,
# SHAs de srclibs, NDK). Lo que NO se ha hecho todavía: correr `fdroid build`
# en el buildserver -- ver el paso 4 de fdroid/GUIA-FDROID.md. Sin eso, no
# hay garantía de que prebuild: compile de verdad; es el paso que suele
# necesitar ajustes con gomobile. Probarlo antes de abrir el MR.
#
# Destino final: metadata/com.creatore.rethinkfork.yml dentro de tu fork
# de gitlab.com/fdroid/fdroiddata

