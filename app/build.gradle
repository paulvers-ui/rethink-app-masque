plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'kotlin-android'
}

// Ensure consistent JVM version for Java and Kotlin compilation
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

// Logic to determine if this is a deGoogled (F-Droid) build
def taskNames = gradle.startParameter.taskNames.join(',').toLowerCase()
def apkBuild = taskNames.contains("full")
def fdroidBuild = taskNames.contains("fdroid")

def fdroidBuildServer = System.getenv("fdroidserver")
def isFdroidBuildServer = fdroidBuildServer != null && !fdroidBuildServer.isEmpty() && fdroidBuildServer != "null"
def deGoogled = !apkBuild || fdroidBuild || isFdroidBuildServer

println("app-task names: '$taskNames'")
println("gradle deGoogled? $deGoogled")

// FIXED: Conditional plugin application
if (!deGoogled) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    println("app firebase plugins applied")
} else {
    println("app firebase plugins SKIPPED")
}

def gitVersion = providers.exec {
    commandLine("git", "describe", "--tags", "--always")
}.standardOutput.asText.get().toString().trim()

def getVersionCode = {
    def code = 0
    try {
        code = Integer.parseInt(System.getenv("VERSION_CODE") ?: "0")
    } catch (NumberFormatException ignored) {}
    
    if (code == 0) {
        code = project.properties['VERSION_CODE'] as Integer ?: 1
    }
    return code
}

android {
    compileSdkVersion(35)
    namespace 'com.creatore.rethinkfork'

    defaultConfig {
        // applicationId matches namespace now -- both are com.creatore.rethinkfork.
        // Previously namespace stayed as com.celzero.bravedns (only controlling the
        // generated R/BuildConfig package) to avoid a ~460-file rename; that rename
        // has since been done, so the two are aligned. See the F-Droid RFP response
        // (fdroid/RFP-4306-RESPONSE.md) for why this mismatch existed and why it was
        // worth fixing: a scanner reading `namespace` instead of `applicationId`
        // could attribute this fork's trackers/listing status to the ORIGINAL
        // Rethink app instead of this one.
        applicationId "com.creatore.rethinkfork"
        minSdkVersion(23)
        targetSdkVersion 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en", "ab", "ang", "ar", "az", "be", "bg", "bn", "cs", "da", "de", "el", "es", "fa", "fi", "fr", "frr", "gay", "hi", "hu", "in", "it", "iw", "ja", "ko", "lir", "lt", "lv", "ml", "nb-rNO", "nl", "or", "peo", "pl", "prg", "pt", "pt-rBR", "ro", "ru", "si", "sk", "sr", "sv", "sw", "ta", "th", "tl", "tr", "tts", "uk", "ur", "uz", "vi", "zh-rCN", "zh-rHK", "zh-rTW"
    }

    // ✅ ADDED: allows libusque.so in jniLibs to be executed at runtime (W^X fix)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // Strip emulator-only and ancient ABI native libs from all dependencies
            excludes += ['**/x86/*.so', '**/x86_64/*.so', '**/armeabi/*.so', '**/armeabi-v7a/*.so']
        }
    }

    // Updated ABI Versioning for Gradle 8.13 / AGP 8.7+ compatibility
    project.ext.versionCodes = ['armeabi': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'x86': 8, 'x86_64': 9]

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abi = output.getFilters().find { it.filterType == "ABI" }?.identifier
            def baseAbiVersionCode = project.ext.versionCodes.get(abi)
            
            if (abi != null && baseAbiVersionCode != null) {
                output.versionCodeOverride = baseAbiVersionCode * 10000000 + variant.versionCode
            }
        }
    }

    // 64-bit only. splits are disabled entirely rather than narrowed to a single
    // ABI: with one ABI included, `universalApk true` emits two byte-identical
    // APKs (universal + arm64 split), which is pure confusion for anyone choosing
    // a download. Disabled here means exactly one APK per build, and abiFilters
    // below is what actually constrains it.
    //
    // armeabi-v7a is dropped because the 32-bit build was never functional:
    // libusque.so exists only under app/src/main/jniLibs/arm64-v8a/ (there is no
    // 32-bit build of it), so every armeabi-v7a APK shipped without a usque
    // binary and WARP could not work on it at all. It was a broken artifact that
    // looked like a valid choice on the download page.
    splits.abi {
        enable false
    }

    // Release signing: read entirely from environment, never from a file in the
    // repo. The release workflow decodes a keystore secret to RELEASE_KEYSTORE_PATH
    // and exports the three companion secrets before invoking Gradle. Locally, this
    // stays inert -- signingConfig only attaches below when the keystore path is
    // both set and points at a file that actually exists, so a normal debug build on
    // a machine with none of these vars set behaves exactly as before.
    def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    def hasReleaseSigning = releaseKeystorePath != null && file(releaseKeystorePath).exists()

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // MITIGATION -- R8 disabled for release builds.
            //
            // Established across three separate release builds (v1.6.1, v1.6.2,
            // v1.6.3) versus debug builds compiled from the SAME commits: release
            // crashes reliably with
            //     F go/Seq : Unknown reference: 42
            //     F libc   : Fatal signal 6 (SIGABRT)
            //     abort() -> go_seq_from_refnum -> cproxyintra_Bridge_Flow
            // while debug never reproduces it even once. Identical Kotlin compiles
            // into both, so this is a build-pipeline difference, not app logic.
            //
            // The two things that differ in debug are debuggable=true and
            // minifyEnabled=false. Two targeted fixes have already been merged
            // against this crash and neither stopped it:
            //   - PR #37 added -keep rules for the whole gomobile/firestack JNI
            //     surface. Verified afterwards by unzipping the shipped v1.6.2 APK
            //     and diffing classes*.dex against the debug APK: 112 firestack
            //     classes in BOTH, zero missing from release, all go.Seq internals
            //     and all Bridge callbacks present. R8 was not stripping anything.
            //   - PR #38 pinned defaultDns, a genuinely unowned Go-backed object
            //     handed across the boundary in GoVpnAdapter.connect(). Real bug,
            //     real fix, still crashed in v1.6.3 (which was confirmed to contain
            //     it) -- so it was not the only such reference.
            //
            // Note this used proguard-android-optimize.txt, the OPTIMIZING default
            // config: beyond shrinking it inlines methods and narrows local live
            // ranges, which is exactly the class of transformation that lets ART
            // collect a Java object earlier than its last apparent use. gomobile's
            // go.Seq$GoRefQueue decrements the Go-side refnum the moment such an
            // object becomes unreachable -- after which any further use from Go
            // hits an unknown refnum and calls abort(). That is consistent with
            // every symptom seen, including the refnum being the same low number
            // each time (gomobile reuses freed slots).
            //
            // Pinning each leaked reference one at a time has now cost several
            // release cycles on a production ISP deployment. Disabling R8 removes
            // the entire class of failure at once, at the cost of a larger APK and
            // no dead-code stripping -- an acceptable trade for a VPN that must not
            // crash. The pin from PR #38 and the keep rules from PR #37 both stay
            // in place, so this can be re-enabled later behind a real
            // reproduction, ideally after auditing every Go-backed object handed
            // across the boundary for a Java-side owner.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
                abiFilters 'arm64-v8a'
            }
            if (!deGoogled) {
                firebaseCrashlytics { nativeSymbolUploadEnabled true }
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xsuppress-warning=SENSELESS_COMPARISON']
    }

    // Room schema export — enables migration verification and schema history
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    flavorDimensions = ["releaseChannel", "releaseType"]
    productFlavors {
        play { dimension "releaseChannel" }
        fdroid { dimension "releaseChannel" }
        website { dimension "releaseChannel" }
        full {
            dimension "releaseType"
            versionCode = getVersionCode()
            versionName = gitVersion
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}


def firestackRepo = project.findProperty("firestackRepo") ?: "ossrh"
def firestackCommit = project.findProperty("firestackCommit") ?: "0.5.5"

def firestackDependency = { suffix = ":debug" ->
    switch (firestackRepo) {
        case "local":
            // Pre-built AAR placed in app/libs/firestack-local.aar by CI.
            // Resolved via flatDir in root build.gradle — never fetched from Maven.
            return "com.celzero:firestack:local@aar"
        case "ossrh":
            return "com.celzero:firestack:${firestackCommit}${suffix}@aar"
        case "jitpack":
            return "com.github.celzero:firestack:${firestackCommit}${suffix}@aar"
        default:
            return "com.celzero:firestack:${firestackCommit}${suffix}@aar"
    }
}

